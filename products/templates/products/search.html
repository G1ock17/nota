{% extends "products/base_catalog.html" %}
{% load static %}

{% block body %}
<div class="min-h-screen section-deep text-foreground">
  {% include "core/partials/navbar.html" %}

  <main class="mx-auto w-full max-w-[min(100%,1680px)] px-5 pb-16 pt-8 sm:px-6 lg:px-8 xl:px-10">
    <div class="mb-7 text-[10px] uppercase tracking-[0.2em] text-muted">
      <a href="{% url 'home' %}" class="nav-link">Главная</a>
      <span class="mx-2">/</span>
      <span>Поиск</span>
    </div>

    <section class="mb-10 border-b border-edge pb-4 text-center">
      <form
        id="search-page-form"
        method="get"
        action="{% url 'products:search' %}"
        hx-get="{% url 'products:search' %}"
        hx-target="#search-results"
        hx-push-url="true"
        hx-trigger="input delay:350ms from:#search-page-input"
        class="mx-auto max-w-2xl"
      >
      <label class="sr-only" for="search-page-input">Поиск товаров</label>
      <div class="relative">
        <input
          id="search-page-input"
          type="text"
          name="q"
          value="{{ current_query }}"
          placeholder="ПОИСК"
          class="w-full bg-transparent py-4 text-center text-4xl font-medium tracking-[0.01em] text-heading placeholder:text-heading/95 md:text-5xl focus:outline-none"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          autofocus
        >
      </div>
      </form>
    </section>

    <div id="search-results">
      {% include "products/partials/search_results.html" %}
    </div>
  </main>

  {% include "core/partials/footer.html" %}
</div>
{% endblock %}
