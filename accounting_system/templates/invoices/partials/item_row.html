{% load core_tags %}
<div class="invoice-row grid grid-cols-12 gap-2 items-center px-3 py-2 border-b border-slate-100">
  <div class="col-span-5">{{ form.name }}</div>
  <div class="col-span-2">{{ form.qty }}</div>
  <div class="col-span-2">{{ form.unit_price }}</div>
  <div class="col-span-2 text-right text-sm font-medium js-amount">0.00</div>
  <div class="col-span-1 text-right">
    <button type="button" class="js-remove-row text-slate-400 hover:text-red-600">
      <i data-lucide="x" class="h-4 w-4"></i>
    </button>
  </div>
  <div class="hidden">{{ form.id }}{{ form.DELETE }}</div>
</div>
