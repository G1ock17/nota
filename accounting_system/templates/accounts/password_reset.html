{% extends 'base.html' %}
{% block title %}Сброс пароля{% endblock %}
{% block content_plain %}
<div class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-md bg-white rounded-2xl border border-slate-200 p-8">
    <h1 class="text-xl font-semibold text-slate-900 mb-1">Сброс пароля</h1>
    <p class="text-sm text-slate-500 mb-5">Укажите email — мы пришлём ссылку для сброса.</p>
    <form method="post" class="space-y-4">{% csrf_token %}
      <input type="email" name="email" required placeholder="email@example.com"
             class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
      <button class="w-full rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700">Отправить ссылку</button>
    </form>
    <a href="{% url 'accounts:login' %}" class="mt-4 inline-block text-sm text-indigo-600 hover:underline">← Вернуться ко входу</a>
  </div>
</div>
{% endblock %}
