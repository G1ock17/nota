{% extends 'base.html' %}
{% block title %}Вход — Учётная система{% endblock %}
{% block content_plain %}
<div class="min-h-screen flex items-center justify-center bg-slate-100 px-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
    <div class="text-center mb-6">
      <div class="mx-auto h-12 w-12 rounded-xl bg-indigo-600 flex items-center justify-center text-white text-xl font-bold">A</div>
      <h1 class="mt-3 text-xl font-semibold text-slate-900">Вход в систему</h1>
      <p class="text-sm text-slate-500">Бухгалтерия и учёт финансов</p>
    </div>
    {% if form.errors %}
      <div class="mb-4 rounded-lg bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-700">
        Неверное имя пользователя или пароль.
      </div>
    {% endif %}
    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Имя пользователя</label>
        <input type="text" name="username" autofocus required
               class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Пароль</label>
        <input type="password" name="password" required
               class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="w-full rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700">
        Войти
      </button>
    </form>
    <div class="mt-4 text-center">
      <a href="{% url 'accounts:password_reset' %}" class="text-sm text-indigo-600 hover:underline">Забыли пароль?</a>
    </div>
  </div>
</div>
{% endblock %}
